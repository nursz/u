<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤️</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
}

/* экраны */
.screen {
    display: none;
    height: 100vh;
    width: 100%;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

.screen.active {
    display: flex;
}

/* карточка */
.card {
    background: rgba(255,255,255,0.85);
    padding: 25px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

/* кнопка */
button {
    margin-top: 15px;
    padding: 10px 20px;
    border: none;
    border-radius: 30px;
    background: #ff4d6d;
    color: white;
    cursor: pointer;
    font-size: 16px;
}

/* popup */
#popup {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    background: white;
    padding: 20px;
    border-radius: 15px;
    display: none;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

/* сердечки */
.heart-bg {
    position: absolute;
    color: #ff4d6d;
    font-size: 20px;
    animation: fall linear infinite;
}

@keyframes fall {
    0% {transform: translateY(-10vh); opacity: 1;}
    100% {transform: translateY(110vh); opacity: 0;}
}
</style>

</head>

<body>

<!-- ЭКРАН 1 -->
<div id="screen1" class="screen active">
    <div class="card">
        <h2>Почему без настроения? 😏</h2>
        <button onclick="nextScreen()">Дальше</button>
    </div>
</div>

<!-- ЭКРАН 2 -->
<div id="screen2" class="screen">
    <div class="card">
        <h2>Давай исправим это 😉</h2>
        <button onclick="openPopup()">Открыть</button>
    </div>
</div>

<!-- ЭКРАН 3 -->
<div id="screen3" class="screen">
    <div class="card">
        <h2>Ну как тебе? 😌</h2>
        <button onclick="nextScreen()">Ещё</button>
    </div>
</div>

<!-- POPUP -->
<div id="popup">
    <p>Теперь настроение точно поднято 😈</p>
    <button onclick="closePopup()">Закрыть</button>
</div>

<script>
let current = 1;

function nextScreen() {
    document.getElementById("screen" + current).classList.remove("active");
    current++;
    document.getElementById("screen" + current).classList.add("active");
}

function openPopup() {
    document.getElementById("popup").style.display = "block";
}

function closePopup() {
    document.getElementById("popup").style.display = "none";
}

/* ❤️ сердечки как у тебя на скрине */
function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart-bg");
    heart.innerHTML = "❤";

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (2 + Math.random() * 3) + "s";
    heart.style.opacity = Math.random();

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 5000);
}

setInterval(createHeart, 200);
</script>

</body>
</html>
